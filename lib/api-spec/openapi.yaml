openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MOSSI Studio capability contribution workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: MOSSI Studio workspace operations
paths:
  /studio/workflow:
    get:
      operationId: getStudioWorkflow
      tags: [workspace]
      summary: Authoritative Studio readiness and contribution boundaries
      responses:
        "200":
          description: Readiness metadata, not proof of connected enterprise services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioWorkflow" }
  /studio/reuse:
    post:
      operationId: checkStudioReuse
      tags: [workspace]
      summary: Check whether authorized internal reuse discovery can proceed
      description: Fails closed while MOSSI identity and internal discovery are not connected. Never falls back to public catalogue matching.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudioReuseInput" }
      responses:
        "400": { description: Invalid goal }
        "503":
          description: Discovery blocked; this is not a no-match result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioBlockedResponse" }
  /enterprise/mcp-discovery:
    get:
      operationId: listMcpDiscoveryEvidence
      tags: [workspace]
      summary: Permission-scoped MCP discovery evidence, separate from the community directory
      security: [{ EnterpriseCapability: [] }]
      responses:
        "200":
          description: Current user approvals with unknown, denied, stale or verified evidence; never invocation approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDiscoveryEvidenceList"
        "401": { description: Initiating-user scoped capability required }
        "503": { description: Policy or evidence unavailable; fail closed }
  /enterprise/mcp-discovery/{id}:
    post:
      operationId: refreshMcpDiscoveryEvidence
      tags: [workspace]
      summary: Explicit authenticated discovery of one operator-approved endpoint
      description: |
        Empty body only. Uses an operator-provisioned bearer secret or user-bound OAuth credential and an
        initiating-user approval. Only initialize, initialized notification, and
        tools/resources/prompts list are sent. Never executes tools, reads resources,
        gets prompts, approves servers, installs code or enables runtime adapters.
        HTTPS public egress only, no redirects; JSON Streamable HTTP responses only.
      security: [{ EnterpriseCapability: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" }
      responses:
        "200":
          description: Discovery evidence; inspect status, not just HTTP success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpDiscoveryEvidence" }
        "400": { description: "Arbitrary body, RPC, endpoint or query forbidden" }
        "401": { description: Initiating-user scoped capability required }
        "403": { description: "Missing, expired or revoked approval or evidence permission" }
        "429": { description: Per-user or global capacity limit reached }
        "503": { description: Invalid policy or unavailable authorization evidence }
  /enterprise/mcp-discovery/{id}/oauth/authorize:
    post:
      operationId: beginMcpDiscoveryOAuth
      tags: [workspace]
      summary: Begin user-bound PKCE authorization for an already approved discovery endpoint
      security: [{ EnterpriseCapability: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpDiscoveryOAuthStartInput" }
      responses:
        "200":
          description: Operator-pinned authorization URL with short-lived user-bound state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpDiscoveryOAuthStart" }
        "400": { description: Invalid request or caller-supplied settings }
        "401": { description: Initiating-user capability required }
        "403": { description: Missing or changed approval or evidence permission }
        "429": { description: Discovery capacity or per-user action limit reached }
        "503": { description: Policy unavailable }
  /enterprise/mcp-discovery/{id}/oauth/callback:
    post:
      operationId: completeMcpDiscoveryOAuth
      tags: [workspace]
      summary: Exchange a one-time PKCE code using the original initiating-user capability
      description: |
        The operator-registered redirect handler forwards state and code using the same
        initiating-user enterprise capability. This is not an anonymous browser callback.
        No identity or redirect is inferred from headers, browser cookies, or OAuth metadata.
      security: [{ EnterpriseCapability: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpDiscoveryOAuthCallbackInput" }
      responses:
        "200":
          description: Opaque credential reference, never access or refresh tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpDiscoveryOAuthCredential" }
        "400": { description: Invalid callback }
        "401": { description: Initiating-user capability required }
        "403": { description: "State, redirect, approval or user binding rejected" }
        "429": { description: Discovery capacity or per-user action limit reached }
        "503": { description: Policy unavailable }
  /enterprise/mcp-discovery/{id}/oauth/refresh:
    post:
      operationId: refreshMcpDiscoveryOAuth
      tags: [workspace]
      summary: Explicitly refresh the current user's discovery credential
      security: [{ EnterpriseCapability: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpDiscoveryOAuthReferenceInput" }
      responses:
        "200":
          description: Rotated user-bound credential reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpDiscoveryOAuthCredential" }
        "400": { description: Invalid request }
        "401": { description: Initiating-user capability required }
        "403": { description: "Credential revoked, expired approval or binding changed" }
        "429": { description: Discovery capacity or per-user action limit reached }
        "503": { description: Policy unavailable }
  /enterprise/mcp-discovery/{id}/oauth/revoke:
    post:
      operationId: revokeMcpDiscoveryOAuth
      tags: [workspace]
      summary: Immediately remove the user's discovery credential and attempt provider revocation
      security: [{ EnterpriseCapability: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpDiscoveryOAuthReferenceInput" }
      responses:
        "200":
          description: Local revocation is complete; remoteRevoked reports provider acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpDiscoveryOAuthRevocation" }
        "400": { description: Invalid request }
        "401": { description: Initiating-user capability required }
        "403": { description: Credential or binding rejected }
        "503": { description: Policy unavailable }
  /builder/discover:
    post:
      operationId: discoverBuilderApproaches
      tags: [workspace]
      deprecated: true
      description: Retained prototype contract. MOSSI Studio blocks public-first builder discovery with 409; use the internal reuse readiness workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderDiscoveryInput"
      responses:
        "200":
          description: Grounded catalogue matches, not installed or approved servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderDiscovery" }
        "400": { description: Invalid goal }
        "409":
          description: Prototype workflow is outside the MOSSI contribution path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioBlockedResponse" }
  /builder/plan:
    post:
      operationId: draftBuilderDefinition
      tags: [workspace]
      deprecated: true
      description: Retained prototype contract. Draft generation is blocked pending authorized internal reuse and repository-backed standards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPlanInput"
      responses:
        "200":
          description: Unsaved AI specification for user review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderPlan" }
        "400": { description: Invalid request }
        "404": { description: Catalogue reference not found }
        "422": { description: Incompatible target or production gateway missing }
        "429": { description: Planning capacity reached }
        "502": { description: Planning failed; no definition saved }
        "409":
          description: Repository-backed contract workflow required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioBlockedResponse" }
  /enterprise/mcp:
    post:
      operationId: callEnterpriseMcp
      tags: [workspace]
      summary: Workspace and user scoped enterprise generation tools
      description: |
        JSON-only stateless MCP endpoint. Generated packages use a bearer capability bound
        to one operator-managed workspace/user grant. Cloudflare OS may use the same scoped
        token with an identity envelope; both asserted IDs must match the token grant.
        A trusted server may instead submit x-foundry-signature: HMAC-SHA256 of the envelope
        JSON body using a purpose-separated bridge key and a timestamp within 60 seconds.
        Version/template selections must match the grant. No ambient wiki fallback is allowed.
      parameters:
        - in: header
          name: x-foundry-signature
          required: false
          schema: { type: string }
      security:
        - EnterpriseCapability: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseMcpInput"
      responses:
        "200":
          description: MCP initialize, tools list, or structured tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request, selection, or candidate
        "401":
          description: Missing or invalid scoped credentials
        "403":
          description: Workspace, user, tool, document, or selection not granted
        "409":
          description: Pinned standards or template changed
        "502":
          description: Knowledge or generation dependency failed without unscoped fallback
        "503":
          description: Bridge not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [workspace]
      summary: Get public shared-workspace overview, excluding enterprise documents and scoped query history
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [workspace]
      summary: List public knowledge documents; restricted and enterprise-granted documents are excluded
      responses:
        "200":
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
    post:
      operationId: createKnowledge
      tags: [workspace]
      summary: Add a knowledge document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
  /knowledge/{id}:
    patch:
      operationId: updateKnowledge
      tags: [workspace]
      summary: Update a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "404":
          description: Document not found
    delete:
      operationId: deleteKnowledge
      tags: [workspace]
      summary: Delete a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted document
        "404":
          description: Document not found
  /knowledge/query:
    post:
      operationId: queryKnowledge
      tags: [workspace]
      summary: Query the knowledge base with cached retrieval and reranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAnswer"
  /agents:
    get:
      operationId: listAgents
      tags: [workspace]
      summary: List agents
      responses:
        "200":
          description: Agent definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [workspace]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}:
    patch:
      operationId: updateAgent
      tags: [workspace]
      summary: Update an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
    delete:
      operationId: deleteAgent
      tags: [workspace]
      summary: Delete an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted agent
        "404":
          description: Agent not found
  /components:
    get:
      operationId: listComponents
      tags: [workspace]
      summary: List MCP servers and apps
      responses:
        "200":
          description: MCP components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpComponent"
    post:
      operationId: createComponent
      tags: [workspace]
      summary: Create an MCP server or app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentInput"
      responses:
        "201":
          description: Created MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
  /components/{id}:
    patch:
      operationId: updateComponent
      tags: [workspace]
      summary: Update an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentUpdate"
      responses:
        "200":
          description: Updated MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
        "404":
          description: Component not found
    delete:
      operationId: deleteComponent
      tags: [workspace]
      summary: Delete an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted MCP component
        "404":
          description: Component not found
  /component-packages:
    get:
      operationId: downloadComponentPackage
      tags: [workspace]
      summary: Retained prototype package contract, blocked in MOSSI Studio
      deprecated: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [cloudflare, openshell]
      responses:
        "409":
          description: Standalone source downloads are outside the MOSSI contribution path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioBlockedResponse" }
        "200":
          description: Generated package archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid package target or component ID
        "404":
          description: Component not found
        "422":
          description: Definition cannot be generated
  /runtimes:
    get:
      operationId: listRuntimes
      tags: [workspace]
      summary: Get portable runtime adapter status
      responses:
        "200":
          description: Available runtime adapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAdapter"
  /mcp-catalogue:
    get:
      operationId: listMcpCatalogue
      tags: [MCP Catalogue]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: focus, in: query, schema: { type: string, enum: [all, priority], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Searchable reference directory; listings are not installed or security approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpCataloguePage" }
        "400": { description: Invalid filters }
  /mcp-catalogue/{id}:
    get:
      operationId: getMcpCatalogueEntry
      tags: [MCP Catalogue]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Reference details and a standards-aware AI builder brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpCatalogueDetail" }
        "400": { description: Invalid identifier }
        "404": { description: Reference not found }
  /mcp-sdks:
    get:
      operationId: listMcpSdks
      tags: [MCP]
      responses:
        "200":
          description: Official specification and language SDK source snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpSdkDirectory" }
  /component-packages/generate:
    post:
      operationId: generateLanguageMcpPackage
      tags: [MCP]
      deprecated: true
      description: Retained prototype contract. MOSSI Studio rejects standalone generation with 409 before model or generator execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageMcpPackageInput" }
      responses:
        "409":
          description: Repository-backed contract and merge-request workflow required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioBlockedResponse" }
        "200":
          description: Reviewable AI-generated source package; build and protocol checks are not implied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageMcpPackage" }
        "400": { description: Invalid request }
        "404": { description: Definition or official SDK source not found }
        "422": { description: Unsupported combination or invalid generated source }
        "429": { description: Generation capacity reached }
        "502": { description: AI provider unavailable or generated response invalid }
components:
  # Discovery credentials and approval management are never part of the public API.
  securitySchemes:
    EnterpriseCapability:
      type: http
      scheme: bearer
      description: Random revocable capability bound to one workspace/user grant, stored hashed.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    StudioWorkflow:
      type: object
      required: [name, phase, status, integrations, languagePolicy, delivery, actions, blockers]
      properties:
        name: { type: string }
        phase: { type: string }
        status: { type: string, enum: [blocked] }
        integrations:
          type: array
          items:
            type: object
            required: [id, name, status, purpose]
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string, enum: [not_connected, unverified] }
              purpose: { type: string }
        languagePolicy:
          type: object
          required: [status, allowedLanguages, suggestedLanguages]
          properties:
            status: { type: string, enum: [unverified] }
            allowedLanguages: { type: array, items: { type: string } }
            suggestedLanguages: { type: array, items: { type: string } }
        delivery:
          type: object
          required: [status, pipeline, capabilityPath, viewPath, contractReview]
          properties:
            status: { type: string, enum: [unverified] }
            pipeline: { type: string }
            capabilityPath: { type: string }
            viewPath: { type: string }
            contractReview: { type: string }
        actions:
          type: object
          required: [canSearchInternal, canDraftGovernedContract, canGenerateImplementation, canOpenMergeRequest]
          properties:
            canSearchInternal: { type: boolean }
            canDraftGovernedContract: { type: boolean }
            canGenerateImplementation: { type: boolean }
            canOpenMergeRequest: { type: boolean }
        blockers: { type: array, items: { type: string } }
    StudioReuseInput:
      type: object
      additionalProperties: false
      required: [goal]
      properties:
        goal: { type: string, minLength: 8, maxLength: 2000 }
    StudioBlockedResponse:
      type: object
      required: [code, error, workflow]
      properties:
        code: { type: string, enum: [MOSSI_INTEGRATION_REQUIRED, MOSSI_CONTRIBUTION_REQUIRED] }
        error: { type: string }
        workflow: { $ref: "#/components/schemas/StudioWorkflow" }
    McpDiscoveryOAuthStartInput:
      type: object
      additionalProperties: false
    McpDiscoveryOAuthCallbackInput:
      type: object
      additionalProperties: false
      required: [state, code, redirectUri]
      properties:
        state: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        code: { type: string, minLength: 1, maxLength: 4000, pattern: "^[\\x21-\\x7e]+$" }
        redirectUri: { type: string, format: uri, maxLength: 2000 }
    McpDiscoveryOAuthReferenceInput:
      type: object
      additionalProperties: false
      required: [credentialReference]
      properties:
        credentialReference: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    McpDiscoveryOAuthStart:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    McpDiscoveryOAuthCredential:
      type: object
      required: [credentialReference, expiresAt]
      properties:
        credentialReference: { type: string }
        expiresAt: { type: string, format: date-time }
    McpDiscoveryOAuthRevocation:
      type: object
      required: [revoked, remoteRevoked]
      properties:
        revoked: { type: boolean, enum: [true] }
        remoteRevoked: { type: boolean }
    McpDiscoveryEvidenceList:
      type: object
      required: [mode, results]
      properties:
        mode: { type: string, enum: [discovery-only] }
        results:
          type: array
          items: { $ref: "#/components/schemas/McpDiscoveryEvidence" }
    McpDiscoveryEvidence:
      type: object
      required: [id, layer, instanceId, catalogueRecordId, endpoint, deployedVersion, transport, protocolVersion, evidenceRevision, permissionRevision, status, reason, checkedAt, expiresAt, inventory, approvedForInvocation, descriptionsAreUntrusted]
      properties:
        id: { type: string }
        layer: { type: string, enum: [openmetadata-interface, catalogued-server] }
        instanceId: { type: string }
        catalogueRecordId: { type: [string, "null"] }
        endpoint: { type: string }
        deployedVersion: { type: string }
        transport: { type: string, enum: [streamable-http] }
        protocolVersion: { type: string }
        evidenceRevision: { type: string }
        permissionRevision: { type: [string, "null"] }
        status: { type: string, enum: [unknown, denied, stale, verified] }
        reason: { type: string }
        checkedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        inventory:
          oneOf:
            - { $ref: "#/components/schemas/McpDiscoveryInventory" }
            - { type: "null" }
        approvedForInvocation: { type: boolean, enum: [false] }
        descriptionsAreUntrusted: { type: boolean, enum: [true] }
    McpDiscoveryInventory:
      type: object
      required: [serverInfo, protocolVersion, tools, resources, prompts]
      properties:
        serverInfo:
          type: object
          required: [name, version]
          properties:
            name: { type: string }
            version: { type: string }
        protocolVersion: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpDiscoveredTool" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/McpDiscoveredResource" }
        prompts:
          type: array
          items: { $ref: "#/components/schemas/McpDiscoveredPrompt" }
    McpDiscoveredTool:
      type: object
      required: [name, inputSchema]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
    McpDiscoveredPrompt:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    McpDiscoveredResource:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        name: { type: string }
        description: { type: string }
    BuilderDiscoveryInput:
      type: object
      required: [goal]
      properties:
        goal: { type: string, minLength: 8, maxLength: 2000 }
    BuilderPlanInput:
      type: object
      required: [goal, catalogueId, language, target, transport]
      properties:
        goal: { type: string, minLength: 8, maxLength: 2000 }
        catalogueId: { type: integer }
        language: { type: string, enum: [typescript, javascript, python, go, csharp, rust, ruby, java, swift, php, kotlin] }
        target: { type: string, enum: [cloudflare, openshell] }
        transport: { type: string, enum: [stdio, streamable-http] }
        dataSource: { type: string, maxLength: 1000 }
        authRequirements: { type: string, maxLength: 1000 }
    BuilderDiscovery:
      type: object
      required: [message, options]
      properties:
        message: { type: string }
        options:
          type: array
          items:
            type: object
            required: [reference, rationale, considerations]
            properties:
              reference: { $ref: "#/components/schemas/McpCatalogueEntry" }
              rationale: { type: string }
              considerations: { type: array, items: { type: string } }
    BuilderPlan:
      type: object
      required: [definition, generationInstructions, categories, referenceUrl, referenceRevision, sdkRepository, specificationRevision, reviewNotes]
      properties:
        definition: { $ref: "#/components/schemas/McpComponentInput" }
        generationInstructions: { type: string }
        categories: { type: array, items: { type: string } }
        referenceUrl: { type: string }
        referenceRevision: { type: string }
        sdkRepository: { type: string }
        specificationRevision: { type: string }
        reviewNotes: { type: array, items: { type: string } }
    EnterpriseMcpInput:
      oneOf:
        - $ref: "#/components/schemas/EnterpriseRpc"
        - $ref: "#/components/schemas/EnterpriseBridgeAssertion"
    EnterpriseRpc:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: number }
        method: { type: string, enum: [initialize, tools/list, tools/call] }
        params: { type: object, additionalProperties: true }
    EnterpriseBridgeAssertion:
      type: object
      additionalProperties: false
      required: [workspaceId, userId, timestamp, rpc]
      properties:
        workspaceId: { type: string, minLength: 1, maxLength: 200 }
        userId: { type: string, minLength: 1, maxLength: 200 }
        timestamp: { type: integer }
        rpc:
          $ref: "#/components/schemas/EnterpriseRpc"
    McpSdk:
      type: object
      required: [language, label, repository, sourceRevision, knowledgeId, targets, tier]
      properties:
        language: { type: string }
        label: { type: string }
        repository: { type: string }
        sourceRevision: { type: string }
        knowledgeId: { type: [integer, "null"] }
        targets: { type: array, items: { type: string, enum: [cloudflare, openshell] } }
        tier: { type: integer }
    McpSdkDirectory:
      type: object
      required: [organizationUrl, specificationRepository, specificationRevision, protocolVersion, specificationKnowledgeId, sdks]
      properties:
        organizationUrl: { type: string }
        specificationRepository: { type: string }
        specificationRevision: { type: string }
        protocolVersion: { type: string }
        specificationKnowledgeId: { type: [integer, "null"] }
        sdks: { type: array, items: { $ref: "#/components/schemas/McpSdk" } }
    LanguageMcpPackageInput:
      type: object
      required: [componentId, language, target]
      properties:
        componentId: { type: integer, minimum: 1 }
        language: { type: string, enum: [typescript, javascript, python, go, csharp, rust, ruby, java, swift, php, kotlin] }
        target: { type: string, enum: [cloudflare, openshell] }
        instructions: { type: string, maxLength: 6000 }
        categories: { type: array, maxItems: 12, uniqueItems: true, items: { type: string } }
    LanguageMcpPackage:
      type: object
      required: [filename, archiveBase64, sourceDigest, language, target, sdkRepository, sdkSourceRevision, specificationRevision, protocolVersion, buildStatus, deploymentStatus, files, appliedCategories]
      properties:
        filename: { type: string }
        archiveBase64: { type: string }
        sourceDigest: { type: string }
        language: { type: string }
        target: { type: string }
        sdkRepository: { type: string }
        sdkSourceRevision: { type: string }
        specificationRevision: { type: string }
        protocolVersion: { type: string }
        buildStatus: { type: string, enum: [not-run] }
        deploymentStatus: { type: string, enum: [not-deployed] }
        files:
          type: array
          items: { $ref: "#/components/schemas/McpProjectFile" }
        appliedCategories: { type: array, items: { type: string } }
    McpProjectFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    McpCatalogueEntry:
