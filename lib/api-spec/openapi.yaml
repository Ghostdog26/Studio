openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Portable agent workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Agent Foundry workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [workspace]
      summary: Get workspace overview
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [workspace]
      summary: List knowledge documents
      responses:
        "200":
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
    post:
      operationId: createKnowledge
      tags: [workspace]
      summary: Add a knowledge document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
  /knowledge/{id}:
    patch:
      operationId: updateKnowledge
      tags: [workspace]
      summary: Update a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "404":
          description: Document not found
    delete:
      operationId: deleteKnowledge
      tags: [workspace]
      summary: Delete a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted document
        "404":
          description: Document not found
  /knowledge/query:
    post:
      operationId: queryKnowledge
      tags: [workspace]
      summary: Query the knowledge base with cached retrieval and reranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAnswer"
  /agents:
    get:
      operationId: listAgents
      tags: [workspace]
      summary: List agents
      responses:
        "200":
          description: Agent definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [workspace]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}:
    patch:
      operationId: updateAgent
      tags: [workspace]
      summary: Update an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
    delete:
      operationId: deleteAgent
      tags: [workspace]
      summary: Delete an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted agent
        "404":
          description: Agent not found
  /components:
    get:
      operationId: listComponents
      tags: [workspace]
      summary: List MCP servers and apps
      responses:
        "200":
          description: MCP components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpComponent"
    post:
      operationId: createComponent
      tags: [workspace]
      summary: Create an MCP server or app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentInput"
      responses:
        "201":
          description: Created MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
  /components/{id}:
    patch:
      operationId: updateComponent
      tags: [workspace]
      summary: Update an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentUpdate"
      responses:
        "200":
          description: Updated MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
        "404":
          description: Component not found
    delete:
      operationId: deleteComponent
      tags: [workspace]
      summary: Delete an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted MCP component
        "404":
          description: Component not found
  /component-packages:
    get:
      operationId: downloadComponentPackage
      tags: [workspace]
      summary: Generate a runnable MCP package from a saved definition
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [cloudflare, openshell]
      responses:
        "200":
          description: Generated package archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid package target or component ID
        "404":
          description: Component not found
        "422":
          description: Definition cannot be generated
  /runtimes:
    get:
      operationId: listRuntimes
      tags: [workspace]
      summary: Get portable runtime adapter status
      responses:
        "200":
          description: Available runtime adapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAdapter"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Overview:
      type: object
      required: [knowledgeCount, agentCount, componentCount, queryCount, cacheHitRate, runtimes, recentActivity]
      properties:
        knowledgeCount: { type: integer }
        agentCount: { type: integer }
        componentCount: { type: integer }
        queryCount: { type: integer }
        cacheHitRate: { type: number }
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/RuntimeAdapter" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    ActivityItem:
      type: object
      required: [id, label, kind, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeDocument:
      type: object
      required: [id, title, content, source, tags, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    KnowledgeInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
    KnowledgeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
    KnowledgeQueryInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2 }
    KnowledgeSource:
      type: object
      required: [id, title, excerpt, score]
      properties:
        id: { type: integer }
        title: { type: string }
        excerpt: { type: string }
        score: { type: number }
    KnowledgeAnswer:
      type: object
      required: [answer, sources, cached, reranked]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeSource" }
        cached: { type: boolean }
        reranked: { type: boolean }
    Agent:
      type: object
      required: [id, name, description, model, runtime, instructions, inputSchema, status, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        model: { type: string }
        runtime: { type: string }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    AgentInput:
      type: object
      required: [name, description, model, runtime, instructions, inputSchema]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        model: { type: string }
        runtime: { type: string, enum: [cloudflare, nvidia, portable] }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        model: { type: string }
        runtime: { type: string, enum: [cloudflare, nvidia, portable] }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        status: { type: string, enum: [draft, active] }
    McpComponent:
      type: object
      required: [id, name, description, kind, transport, jsonSchema, status, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    McpComponentInput:
      type: object
      required: [name, description, kind, transport, jsonSchema]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
    McpComponentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
        status: { type: string, enum: [draft, ready] }
    RuntimeAdapter:
      type: object
      required: [id, name, status, description, features]
      properties:
        id: { type: string, enum: [cloudflare, nvidia] }
        name: { type: string }
        status: { type: string, enum: [adapter-ready, not-connected] }
        description: { type: string }
        features:
          type: array
          items: { type: string }

