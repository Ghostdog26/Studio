openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Portable agent workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Agent Foundry workspace operations
paths:
  /enterprise/mcp:
    post:
      operationId: callEnterpriseMcp
      tags: [workspace]
      summary: Workspace and user scoped enterprise generation tools
      description: |
        JSON-only stateless MCP endpoint. Generated packages use a bearer capability bound
        to one operator-managed workspace/user grant. Cloudflare OS may use the same scoped
        token with an identity envelope; both asserted IDs must match the token grant.
        A trusted server may instead submit x-foundry-signature: HMAC-SHA256 of the envelope
        JSON body using a purpose-separated bridge key and a timestamp within 60 seconds.
        Version/template selections must match the grant. No ambient wiki fallback is allowed.
      parameters:
        - in: header
          name: x-foundry-signature
          required: false
          schema: { type: string }
      security:
        - EnterpriseCapability: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseMcpInput"
      responses:
        "200":
          description: MCP initialize, tools list, or structured tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request, selection, or candidate
        "401":
          description: Missing or invalid scoped credentials
        "403":
          description: Workspace, user, tool, document, or selection not granted
        "409":
          description: Pinned standards or template changed
        "502":
          description: Knowledge or generation dependency failed without unscoped fallback
        "503":
          description: Bridge not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [workspace]
      summary: Get public shared-workspace overview, excluding enterprise documents and scoped query history
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [workspace]
      summary: List public knowledge documents; restricted and enterprise-granted documents are excluded
      responses:
        "200":
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
    post:
      operationId: createKnowledge
      tags: [workspace]
      summary: Add a knowledge document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
  /knowledge/{id}:
    patch:
      operationId: updateKnowledge
      tags: [workspace]
      summary: Update a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "404":
          description: Document not found
    delete:
      operationId: deleteKnowledge
      tags: [workspace]
      summary: Delete a knowledge document
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted document
        "404":
          description: Document not found
  /knowledge/query:
    post:
      operationId: queryKnowledge
      tags: [workspace]
      summary: Query the knowledge base with cached retrieval and reranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAnswer"
  /agents:
    get:
      operationId: listAgents
      tags: [workspace]
      summary: List agents
      responses:
        "200":
          description: Agent definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [workspace]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}:
    patch:
      operationId: updateAgent
      tags: [workspace]
      summary: Update an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
    delete:
      operationId: deleteAgent
      tags: [workspace]
      summary: Delete an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted agent
        "404":
          description: Agent not found
  /components:
    get:
      operationId: listComponents
      tags: [workspace]
      summary: List MCP servers and apps
      responses:
        "200":
          description: MCP components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpComponent"
    post:
      operationId: createComponent
      tags: [workspace]
      summary: Create an MCP server or app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentInput"
      responses:
        "201":
          description: Created MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
  /components/{id}:
    patch:
      operationId: updateComponent
      tags: [workspace]
      summary: Update an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpComponentUpdate"
      responses:
        "200":
          description: Updated MCP component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpComponent"
        "404":
          description: Component not found
    delete:
      operationId: deleteComponent
      tags: [workspace]
      summary: Delete an MCP component
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted MCP component
        "404":
          description: Component not found
  /component-packages:
    get:
      operationId: downloadComponentPackage
      tags: [workspace]
      summary: Generate a runnable MCP package from a saved definition
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [cloudflare, openshell]
      responses:
        "200":
          description: Generated package archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid package target or component ID
        "404":
          description: Component not found
        "422":
          description: Definition cannot be generated
  /runtimes:
    get:
      operationId: listRuntimes
      tags: [workspace]
      summary: Get portable runtime adapter status
      responses:
        "200":
          description: Available runtime adapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeAdapter"
  /mcp-catalogue:
    get:
      operationId: listMcpCatalogue
      tags: [MCP Catalogue]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: focus, in: query, schema: { type: string, enum: [all, priority], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Searchable reference directory; listings are not installed or security approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpCataloguePage" }
        "400": { description: Invalid filters }
  /mcp-catalogue/{id}:
    get:
      operationId: getMcpCatalogueEntry
      tags: [MCP Catalogue]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Reference details and a standards-aware AI builder brief
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpCatalogueDetail" }
        "400": { description: Invalid identifier }
        "404": { description: Reference not found }
  /mcp-sdks:
    get:
      operationId: listMcpSdks
      tags: [MCP]
      responses:
        "200":
          description: Official specification and language SDK source snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpSdkDirectory" }
  /component-packages/generate:
    post:
      operationId: generateLanguageMcpPackage
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageMcpPackageInput" }
      responses:
        "200":
          description: Reviewable AI-generated source package; build and protocol checks are not implied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageMcpPackage" }
        "400": { description: Invalid request }
        "404": { description: Definition or official SDK source not found }
        "422": { description: Unsupported combination or invalid generated source }
        "429": { description: Generation capacity reached }
        "502": { description: AI provider unavailable or generated response invalid }
components:
  securitySchemes:
    EnterpriseCapability:
      type: http
      scheme: bearer
      description: Random revocable capability bound to one workspace/user grant, stored hashed.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    EnterpriseMcpInput:
      oneOf:
        - $ref: "#/components/schemas/EnterpriseRpc"
        - $ref: "#/components/schemas/EnterpriseBridgeAssertion"
    EnterpriseRpc:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf:
            - { type: string }
            - { type: number }
        method: { type: string, enum: [initialize, tools/list, tools/call] }
        params: { type: object, additionalProperties: true }
    EnterpriseBridgeAssertion:
      type: object
      additionalProperties: false
      required: [workspaceId, userId, timestamp, rpc]
      properties:
        workspaceId: { type: string, minLength: 1, maxLength: 200 }
        userId: { type: string, minLength: 1, maxLength: 200 }
        timestamp: { type: integer }
        rpc:
          $ref: "#/components/schemas/EnterpriseRpc"
    McpSdk:
      type: object
      required: [language, label, repository, sourceRevision, knowledgeId, targets, tier]
      properties:
        language: { type: string }
        label: { type: string }
        repository: { type: string }
        sourceRevision: { type: string }
        knowledgeId: { type: [integer, "null"] }
        targets: { type: array, items: { type: string, enum: [cloudflare, openshell] } }
        tier: { type: integer }
    McpSdkDirectory:
      type: object
      required: [organizationUrl, specificationRepository, specificationRevision, protocolVersion, specificationKnowledgeId, sdks]
      properties:
        organizationUrl: { type: string }
        specificationRepository: { type: string }
        specificationRevision: { type: string }
        protocolVersion: { type: string }
        specificationKnowledgeId: { type: [integer, "null"] }
        sdks: { type: array, items: { $ref: "#/components/schemas/McpSdk" } }
    LanguageMcpPackageInput:
      type: object
      required: [componentId, language, target]
      properties:
        componentId: { type: integer, minimum: 1 }
        language: { type: string, enum: [typescript, javascript, python, go, csharp, rust, ruby, java, swift, php, kotlin] }
        target: { type: string, enum: [cloudflare, openshell] }
        instructions: { type: string, maxLength: 3000 }
        categories: { type: array, maxItems: 12, uniqueItems: true, items: { type: string } }
    LanguageMcpPackage:
      type: object
      required: [filename, archiveBase64, sourceDigest, language, target, sdkRepository, sdkSourceRevision, specificationRevision, protocolVersion, buildStatus, deploymentStatus, files, appliedCategories]
      properties:
        filename: { type: string }
        archiveBase64: { type: string }
        sourceDigest: { type: string }
        language: { type: string }
        target: { type: string }
        sdkRepository: { type: string }
        sdkSourceRevision: { type: string }
        specificationRevision: { type: string }
        protocolVersion: { type: string }
        buildStatus: { type: string, enum: [not-run] }
        deploymentStatus: { type: string, enum: [not-deployed] }
        files:
          type: array
          items: { $ref: "#/components/schemas/McpProjectFile" }
        appliedCategories: { type: array, items: { type: string } }
    McpProjectFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    McpCatalogueEntry:
      type: object
      required: [id, name, url, description, categories, languages, scopes, platforms, officialListed, reviewStatus, knowledgeId, sourceRevision, importedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        officialListed: { type: boolean }
        reviewStatus: { type: string, enum: [unreviewed] }
        knowledgeId: { type: [integer, "null"] }
        sourceRevision: { type: string }
        importedAt: { type: string, format: date-time }
    McpCatalogueFacet:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    McpCataloguePage:
      type: object
      required: [items, total, catalogueTotal, page, pageSize, categories, priorityCategories, languages, scopes, sourceUrl, sourceRevision, importedAt, knowledgeCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/McpCatalogueEntry" } }
        total: { type: integer }
        catalogueTotal: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        categories: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        priorityCategories: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        languages: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        scopes: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        sourceUrl: { type: string }
        sourceRevision: { type: [string, "null"] }
        importedAt: { type: [string, "null"], format: date-time }
        knowledgeCount: { type: integer }
    McpCatalogueDetail:
      type: object
      required: [entry, builderBrief, standardsKnowledgeId, sourceUrl, reviewStandards]
      properties:
        entry: { $ref: "#/components/schemas/McpCatalogueEntry" }
        builderBrief: { type: string }
        standardsKnowledgeId: { type: [integer, "null"] }
        sourceUrl: { type: string }
        reviewStandards: { type: array, items: { $ref: "#/components/schemas/McpCategoryStandard" } }
    McpCategoryCheck:
      type: object
      required: [id, requirement, evidence, acceptanceTest]
      properties:
        id: { type: string }
        requirement: { type: string }
        evidence: { type: string }
        acceptanceTest: { type: string }
    McpCategoryStandard:
      type: object
      required: [category, version, summary, knowledgeId, checks]
      properties:
        category: { type: string }
        version: { type: string }
        summary: { type: string }
        knowledgeId: { type: [integer, "null"] }
        checks: { type: array, items: { $ref: "#/components/schemas/McpCategoryCheck" } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Overview:
      type: object
      required: [knowledgeCount, agentCount, componentCount, queryCount, cacheHitRate, runtimes, recentActivity]
      properties:
        knowledgeCount: { type: integer }
        agentCount: { type: integer }
        componentCount: { type: integer }
        queryCount: { type: integer }
        cacheHitRate: { type: number }
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/RuntimeAdapter" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    ActivityItem:
      type: object
      required: [id, label, kind, createdAt]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeDocument:
      type: object
      required: [id, title, content, source, tags, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    KnowledgeInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
    KnowledgeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        source: { type: string }
        tags:
          type: array
          items: { type: string }
    KnowledgeQueryInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2 }
    KnowledgeSource:
      type: object
      required: [id, title, excerpt, score]
      properties:
        id: { type: integer }
        title: { type: string }
        excerpt: { type: string }
        score: { type: number }
    KnowledgeAnswer:
      type: object
      required: [answer, sources, cached, reranked]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeSource" }
        cached: { type: boolean }
        reranked: { type: boolean }
    Agent:
      type: object
      required: [id, name, description, model, runtime, instructions, inputSchema, status, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        model: { type: string }
        runtime: { type: string }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    AgentInput:
      type: object
      required: [name, description, model, runtime, instructions, inputSchema]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        model: { type: string }
        runtime: { type: string, enum: [cloudflare, nvidia, portable] }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        model: { type: string }
        runtime: { type: string, enum: [cloudflare, nvidia, portable] }
        instructions: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        status: { type: string, enum: [draft, active] }
    McpComponent:
      type: object
      required: [id, name, description, kind, transport, jsonSchema, status, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    McpComponentInput:
      type: object
      required: [name, description, kind, transport, jsonSchema]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
    McpComponentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { type: string, enum: [server, app] }
        transport: { type: string }
        jsonSchema: { type: object, additionalProperties: true }
        status: { type: string, enum: [draft, ready] }
    RuntimeAdapter:
      type: object
      required: [id, name, status, description, features]
      properties:
        id: { type: string, enum: [cloudflare, nvidia] }
        name: { type: string }
        status: { type: string, enum: [adapter-ready, not-connected] }
        description: { type: string }
        features:
          type: array
          items: { type: string }
