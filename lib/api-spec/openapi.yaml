        categories: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        priorityCategories: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        languages: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        scopes: { type: array, items: { $ref: "#/components/schemas/McpCatalogueFacet" } }
        sourceUrl: { type: string }
        sourceRevision: { type: [string, "null"] }
        importedAt: { type: [string, "null"], format: date-time }
        knowledgeCount: { type: integer }
    McpCatalogueDetail:
