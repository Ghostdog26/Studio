kind = "web"
previewPath = "/"
title = "MOSSI Studio"
description = "MOSSI Studio is a reuse-first, contract-first capability contribution workspace. Internal integrations and GitLab handoff are pending verification; existing prototype records are preserved."
version = "1.0.0"
id = "artifacts/agent-foundry"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19602

[services.development]
run = "pnpm --filter @workspace/agent-foundry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-foundry", "run", "build" ]
serve = "static"
publicDir = "artifacts/agent-foundry/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19602"
BASE_PATH = "/"

[[services]]
name = "Cloudflare OS"
paths = ["/cloudflare-os", "/cloudflare-os/api"]
localPort = 19603

[services.development]
run = "pnpm --filter @workspace/scripts run cloudflare-os:serve"

[services.env]
PORT = "19603"
BASE_PATH = "/cloudflare-os/"
